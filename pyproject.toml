[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bender"
version = "0.1.0"
description = "Independent computational project for generating and analytically solving strength of materials problems"
authors = [
    { name = "Colossal", email = "colossal@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sympy>=1.12",
    "pint>=0.23"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "build>=1.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/bender"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "C90", "I", "N", "D", "UP", "YTT",
    "ANN", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10",
    "DJ", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI",
    "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "INT", "ARG",
    "PTH", "TD", "FIX", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"
]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN"]
